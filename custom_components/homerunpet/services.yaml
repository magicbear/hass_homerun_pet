get_ys7_credentials:
  name: Get YS7 credentials
  description: Fetch Ezviz appKey, access token, camera serial, and domain on demand for self-hosted SRS. The token is requested only when this service is called.
  fields:
    device_id:
      name: Device
      description: Homerun camera device. Optional when the account has only one camera.
      required: false
      selector:
        device:
          integration: homerunpet
    entity_id:
      name: Entity
      description: Any entity of the target Homerun device.
      required: false
      selector:
        entity:
          integration: homerunpet
    device_serial:
      name: Device serial
      description: Parent appliance serial or Ezviz camera serial.
      required: false
      example: C12345678
      selector:
        text:
